<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторизация</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <div class="container">
        <h1>Авторизация</h1>

        <div class="form">
            <input 
                id="loginInput"
                type="text"
                placeholder="Введите логин повелитель"
            >

            <input 
                id="passwordInput"
                type="password"
                placeholder="Введите пароль повелитель"
            >

            <button id="loginButton">
                Войти
            </button>
        </div>

        <div id="message"></div>
    </div>

    <script src="index.js"></script>
</body>
</html>
