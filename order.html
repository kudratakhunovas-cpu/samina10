<body data-page="order">

<header>
  <a class="logo" href="index.html">SIVVA<small>PREMIUM SHOES</small></a>
  <nav>
    <a href="index.html">Главная</a>
    <a href="catalog.html">Каталог</a>

<section class="section">
  <p class="eyebrow">Almost yours</p>
  <h1>Оформление заявки</h1>
  <p class="muted section-intro">
    Заполни данные для заявки. В учебной версии
    данные никуда не отправляются.
  </p>

  <form id="orderForm" class="form-box">
    <label for="customerName">Имя</label>
    <input id="customerName" type="text" placeholder="Твоё имя" required>

    <label for="customerPhone">Номер телефона</label>
    <input id="customerPhone" type="tel" placeholder="+996 ..." required>

    <label for="customerAddress">Город и адрес доставки</label>
    <textarea id="customerAddress" rows="3"
      placeholder="Например, Бишкек..." required></textarea>

    <label for="customerComment">Комментарий (необязательно)</label>
    <textarea id="customerComment" rows="2"
      placeholder="Размер, цвет и пожелания"></textarea>

    <button type="submit">Подтвердить заявку</button>
  </form>
</section>

<footer>SIVVA SHOP · PREMIUM SHOES · KYRGYZSTAN</footer>
<script src="script.js"></script>
</body>
